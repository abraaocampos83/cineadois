<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAdois - Onde as preferências se encontram!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo.png" alt="CineAdois" class="logo-img">
        <p>“Onde as preferências se encontram!”</p>
    </header>

    <main class="home-grid">
        <div class="card-wrapper">
            <a href="match.html" class="card">
                <span class="icon">🍿</span>
                <h2>Match de Pipoca!</h2>
                <p>O encontro dos gostos.</p>
            </a>
        </div>

        <div class="card-wrapper">
            <a href="review.html" class="card">
                <span class="icon">⭐</span>
                <h2>Review Real!</h2>
                <p>Opinião sem filtros.</p>
            </a>
        </div>

        <div class="card-wrapper">
            <a href="cinema.html" class="card">
                <span class="icon">🎬</span>
                <h2>Partiu Telão!</h2>
                <p>Cinema na sua cidade.</p>
            </a>
        </div>
    </main>

    <section class="recent-matches" id="recent-section">
        <h3>O que outros casais estão assistindo 💘</h3>
        <div id="match-slider"></div>
    </section>

    <footer>
        <p>&copy; 2026 CineAdois - Criado para facilitar o seu momento cinema.</p>
    </footer>

    <script>
        async function initMural() {
            const slider = document.getElementById('match-slider');
            const section = document.getElementById('recent-section');

            try {
                const response = await fetch('./api/historico');
                if (!response.ok) return;

                const matches = await response.json();
                if (!matches || matches.length === 0) return;

                slider.innerHTML = '';
                matches.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = `slide-item ${index === 0 ? 'active' : ''}`;
                    const listaFilmes = Array.isArray(item.filmes) ? item.filmes : [];
                    const moviesHtml = listaFilmes.map(f => `<span class="movie-tag">${f}</span>`).join('');

                    div.innerHTML = `
                        <div class="search-criteria">"Para quem buscou: ${item.busca}"</div>
                        <div class="found-movies">${moviesHtml}</div>
                    `;
                    slider.appendChild(div);
                });

                section.style.display = 'block';

                let currentSlide = 0;
                const slides = slider.querySelectorAll('.slide-item');
                if (slides.length > 1) {
                    setInterval(() => {
                        slides[currentSlide].classList.remove('active');
                        currentSlide = (currentSlide + 1) % slides.length;
                        slides[currentSlide].classList.add('active');
                    }, 5000);
                }
            } catch (e) { console.error(e); }
        }
        window.addEventListener('DOMContentLoaded', initMural);
    </script>
</body>
</html>
