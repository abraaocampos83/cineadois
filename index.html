<script>
    async function carregarMural() {
        const slider = document.getElementById('match-slider');
        const section = document.getElementById('recent-section');

        try {
            // Chamada para a API
            const response = await fetch('/api/historico');
            const matches = await response.json();

            // Se não houver dados, o quadro permanece escondido
            if (!matches || !Array.isArray(matches) || matches.length === 0) {
                console.log("Mural: Nenhum dado para exibir.");
                return;
            }

            // LIMPA E PREPARA O SLIDER
            slider.innerHTML = '';
            
            matches.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `slide-item ${index === 0 ? 'active' : ''}`;
                
                // Garante que temos uma lista de filmes para mostrar
                const filmesArray = Array.isArray(item.filmes) ? item.filmes : [];
                const moviesHtml = filmesArray.map(f => `<span class="movie-tag">${f}</span>`).join('');

                div.innerHTML = `
                    <div class="search-criteria">"Para quem buscou: ${item.busca}"</div>
                    <div class="found-movies">${moviesHtml}</div>
                `;
                slider.appendChild(div);
            });

            // MOSTRA A SEÇÃO (Forçando via estilo direto)
            section.style.display = 'block';
            section.style.visibility = 'visible';
            section.style.opacity = '1';

            // Inicia o carrossel se houver mais de um item
            if (matches.length > 1) {
                let current = 0;
                const slides = slider.querySelectorAll('.slide-item');
                setInterval(() => {
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }, 5000);
            }
        } catch (error) {
            console.error("Erro ao carregar o mural:", error);
        }
    }

    // Executa assim que a página abre
    window.addEventListener('load', carregarMural);
</script>
