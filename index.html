<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAdois - Onde as preferências se encontram!</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f1c40f">
    
    <style>
        /* --- Configurações Gerais --- */
        body { 
            background-color: #121212; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            color: white; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { text-align: center; padding: 40px 20px 20px; }
        .logo-img { max-width: 280px; height: auto; }
        .slogan-original { color: #ccc; margin-top: 10px; font-size: 1rem; font-style: italic; }
        
        /* --- Layout de Cards Principal --- */
        .home-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card-wrapper {
            flex: 1;
            min-width: 280px;
            max-width: 320px;
        }

        /* AQUI ESTÁ O DEGRADÊ IGUAL AO DO MURAL */
        .card {
            background: linear-gradient(180deg, rgba(241,196,15,0.1) 0%, rgba(30,30,30,1) 100%);
            border: 1px solid rgba(241,196,15,0.2);
            border-radius: 20px;
            padding: 35px 25px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #f1c40f;
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.1);
            background: linear-gradient(180deg, rgba(241,196,15,0.15) 0%, rgba(30,30,30,1) 100%);
        }

        .icon { font-size: 50px; margin-bottom: 20px; }
        .card h2 { color: #f1c40f; margin: 0 0 10px 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
        .card p { color: #bbb; font-size: 0.95rem; margin: 0; }

        /* --- Seção de Últimos Matches (Mural) --- */
        .recent-matches {
            width: 90%;
            max-width: 800px;
            margin: 60px auto;
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(241,196,15,0.1) 0%, rgba(18,18,18,0) 100%);
            border-radius: 20px;
            border: 1px solid rgba(241,196,15,0.2);
            text-align: center;
            display: none; 
        }

        .recent-matches h3 {
            color: #f1c40f;
            font-size: 1.1rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #match-slider { position: relative; min-height: 140px; overflow: hidden; }

        .slide-item {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slide-item.active { opacity: 1; position: relative; }

        .search-criteria {
            font-style: italic;
            color: #f1c40f;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .found-movies { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .movie-tag {
            background: #262626;
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        /* --- Footer --- */
        footer { text-align: center; padding: 60px 20px 40px; color: #666; font-size: 0.9em; width: 100%; }
        footer a { color: #f1c40f; text-decoration: none; margin-top: 10px; display: inline-block; }

    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="CineAdois" class="logo-img">
        <p class="slogan-original">“Onde as preferências se encontram!”</p>
    </header>

    <main class="home-grid">
        <div class="card-wrapper">
            <a href="match.html" class="card">
                <span class="icon">🍿</span>
                <h2>Match de Pipoca!</h2>
                <p>O encontro dos gostos.</p>
            </a>
        </div>

        <div class="card-wrapper">
            <a href="review.html" class="card">
                <span class="icon">⭐</span>
                <h2>Review Real!</h2>
                <p>Opinião sem filtros.</p>
            </a>
        </div>

        <div class="card-wrapper">
            <a href="cinema.html" class="card">
                <span class="icon">🎬</span>
                <h2>Partiu Telão!</h2>
                <p>Cinema na sua cidade.</p>
            </a>
        </div>
    </main>

    <section class="recent-matches" id="recent-section">
        <h3>O que outros casais estão assistindo 💘</h3>
        <div id="match-slider"></div>
    </section>

    <footer>
        <p>&copy; 2026 CineAdois - Criado para facilitar o seu momento cinema.</p>
        <a href="sobre.html">Sobre o Projeto</a>
    </footer>

    <script>
        async function initMural() {
            const slider = document.getElementById('match-slider');
            const section = document.getElementById('recent-section');

            try {
                const response = await fetch('./api/historico');
                if (!response.ok) return;

                const matches = await response.json();
                if (!matches || matches.length === 0) return;

                slider.innerHTML = '';

                matches.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = `slide-item ${index === 0 ? 'active' : ''}`;
                    
                    const listaFilmes = Array.isArray(item.filmes) ? item.filmes : [];
                    const moviesHtml = listaFilmes.map(f => `<span class="movie-tag">${f}</span>`).join('');

                    div.innerHTML = `
                        <div class="search-criteria">"Para quem buscou: ${item.busca}"</div>
                        <div class="found-movies">${moviesHtml}</div>
                    `;
                    slider.appendChild(div);
                });

                section.style.display = 'block';

                let currentSlide = 0;
                const slides = slider.querySelectorAll('.slide-item');
                
                if (slides.length > 1) {
                    setInterval(() => {
                        slides[currentSlide].classList.remove('active');
                        currentSlide = (currentSlide + 1) % slides.length;
                        slides[currentSlide].classList.add('active');
                    }, 5000);
                }

            } catch (error) {
                console.error("Erro ao carregar o mural:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', initMural);
    </script>

</body>
</html>
